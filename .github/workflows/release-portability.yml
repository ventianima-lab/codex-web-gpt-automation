name: release-portability
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: '3.11' }
      # Pinned to the reviewed commit for actions/setup-node v4.4.0; a mutable
      # tag would let an upstream retag change what this supply-chain gate runs.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24.19.0' }
      - run: python -m pip install "pytest>=8,<10"
      - run: python scripts/prepare_oracle_018_ci.py
      - run: python scripts/prepare_devspace_108_ci.py
      - run: python scripts/check_portability.py --root .
      - run: python scripts/check_docs.py --root .
      - run: python scripts/run_fast_gate.py --enforce-budget
      - run: python scripts/run_golden_path_smoke.py
      - run: python scripts/run_v4_contract_tests.py --focused
      - run: python scripts/run_v3_contract_tests.py
      - run: python scripts/run_v4_contract_tests.py --full
