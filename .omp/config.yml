# Project-local Codex routing. Credentials and browser state stay outside the repository.
modelRoleStorage: project

modelRoles:
  # Cross-layer integration after ownership and receipt contracts are settled.
  default: openai-codex/gpt-5.6-terra:medium
  # Fast classification, inventory, and deterministic mechanical updates.
  tiny: openai-codex/gpt-5.3-codex-spark:low
  smol: openai-codex/gpt-5.3-codex-spark:medium
  # One isolated runtime module and its focused contract test.
  task: openai-codex/gpt-5.4-mini:medium
  # Authority, recovery, workflow topology, and release-risk decisions.
  plan: openai-codex/gpt-5.6-terra:high
  slow: openai-codex/gpt-5.6-terra:high
  reviewer: openai-codex/gpt-5.6-terra:high

cycleOrder:
  - tiny
  - smol
  - default
  - plan

task:
  agentModelOverrides:
    sonic: "@tiny"
    scout: "@smol"
    librarian: "@smol"
    task: "@task"
    reviewer: "@reviewer"
    security-reviewer: "@reviewer"

# Root and .omp/AGENTS.md provide the contract; avoid repeating it per turn.
advisor:
  enabled: false
